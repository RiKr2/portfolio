    <rect x="14" y="782" width="150" height="46" rx="12" fill="#25D366"/>
    <path d="M44 796a9 9 0 0 1 9 9c0 2.2-1 4.4-2.2 5.6l1.2 4.4-4.6-1.7A9 9 0 1 1 44 796z" stroke="#fff" stroke-width="1.8" fill="none" stroke-linejoin="round"/>
    <text x="64" y="810" fill="#fff" font-size="14" font-weight="700">WhatsApp</text>
