    <path d="M196 799c1-2 3.8-2 4.7 0l1.4 2.8c.5 1 0 2.3-.9 3.2s-.9 2.3 0 3.7 2.8 2.3 3.7 1.4 2.3-1.4 3.2-.9l2.8 1.4c2 1 2 3.7 0 4.7-2.3 2.3-6.5 1.8-10.2-1.9s-6-11.9-4.7-14.4z" stroke="#E94CFF" stroke-width="1.5" fill="none"/>
