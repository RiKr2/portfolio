        <rect x="186" y="781" width="18" height="16" rx="2"/><path d="M186 786h18M190 779v4M200 779v4"/>
        <path d="M272 780l5-2v18l-5 2-6-2-5 2v-18l5-2zM272 780v18M266 778v18"/>
        <circle cx="351" cy="784" r="4.5"/><path d="M343 798c1-5 4-7 8-7s7 2 8 7"/>
