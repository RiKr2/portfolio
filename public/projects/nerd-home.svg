    <linearGradient id="heroFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset=".3" stop-color="#000" stop-opacity="0"/><stop offset=".65" stop-color="#000" stop-opacity=".4"/><stop offset="1" stop-color="#000" stop-opacity=".8"/>
    </linearGradient>
    <linearGradient id="p2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00C6FB"/><stop offset="1" stop-color="#005BEA"/></linearGradient>
    <linearGradient id="p3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F5AF19"/><stop offset="1" stop-color="#F12711"/></linearGradient>
